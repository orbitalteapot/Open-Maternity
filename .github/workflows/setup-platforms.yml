name: Set up Android and iOS folders

# Runs once: generates android/ and ios/ with Flutter's own templates, applies
# Open Maternity's settings (tool/setup_platforms.py), commits them, and starts CI.
# On later pushes it sees the folders exist and stops after a few seconds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Already set up?
        id: check
        run: |
          if [ -d android ] && [ -d ios ]; then echo "done=true" >> "$GITHUB_OUTPUT"; echo "Platform folders exist; nothing to do."; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.done != 'true'
        with:
          flutter-version: "3.47.8"
          channel: stable
      - name: Generate and configure
        if: steps.check.outputs.done != 'true'
        run: |
          flutter create --org no.openmaternity --project-name open_maternity --platforms android,ios . 2>&1 | tee setup-log.txt
          rm -f test/widget_test.dart
          python3 tool/setup_platforms.py 2>&1 | tee -a setup-log.txt
          flutter pub get 2>&1 | tee -a setup-log.txt
          git status --short | tee -a setup-log.txt
      - name: Commit
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios pubspec.lock .metadata
          git commit -m "Add Android and iOS platform folders" -m "Generated by flutter create (Flutter 3.47.8) and tool/setup_platforms.py."
          git push origin HEAD:main
      - name: Start CI on the new commit
        if: steps.check.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
      - name: Save log
        if: always() && steps.check.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: bash tool/push_log.sh ci-logs-setup setup-log.txt
