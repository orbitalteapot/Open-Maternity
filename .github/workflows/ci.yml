name: CI

# Every push to main: checks the code, runs the tests, builds Android and iOS,
# and publishes an installable test APK on the "test-build" release.
# Store screenshots in all languages are a download on each run's page; copy them
# to docs/store-screenshots when they should be kept (see docs/RELEASE.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  screenshots:
    name: Store screenshots
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Render screenshots in all languages
        run: flutter test --update-goldens tool/screenshots
      - uses: actions/upload-artifact@v6
        with:
          name: store-screenshots-${{ github.run_number }}
          path: tool/screenshots/out

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check platform folders
        id: ready
        run: |
          if [ -f android/app/build.gradle.kts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::android/ is not set up yet; the setup workflow adds it."; fi
      - uses: actions/setup-java@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        if: steps.ready.outputs.ok == 'true'
        run: flutter pub get
      - name: Build test APK (with test tools in Settings)
        if: steps.ready.outputs.ok == 'true'
        run: |
          flutter build apk --release --dart-define=OM_TESTING=true --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk open-maternity-test.apk
      - name: Build Play Store bundle
        if: steps.ready.outputs.ok == 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v6
        if: steps.ready.outputs.ok == 'true'
        with:
          name: android-${{ github.run_number }}
          path: |
            open-maternity-test.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Publish test APK
        if: steps.ready.outputs.ok == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build open-maternity-test.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Test build ${GITHUB_RUN_NUMBER}" \
            --notes "Android test build from ${GITHUB_SHA::7}. Download open-maternity-test.apk on your Android phone and open it to install (allow installing from this source when asked). Settings has an extra 'For testing' section with sample data. Not for the store."

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check platform folders
        id: ready
        run: |
          if [ -f ios/Runner/Info.plist ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ios/ is not set up yet; the setup workflow adds it."; fi
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        if: steps.ready.outputs.ok == 'true'
        run: flutter pub get
      - name: Build iOS app (not signed)
        if: steps.ready.outputs.ok == 'true'
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          cd build/ios/iphoneos && zip -qr ../../../open-maternity-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v6
        if: steps.ready.outputs.ok == 'true'
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: open-maternity-ios-unsigned.zip
